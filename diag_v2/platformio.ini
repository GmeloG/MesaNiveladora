; Teste A/B da porta série: plataforma antiga/estável (STM32duino 2.x),
; sem o remendo cpu_flags.py. Correr a partir da pasta MesaNiveladora:
;   pio run -d diag_v2 -t upload
;   pio device monitor -d diag_v2
[env:diag_v2]
platform = ststm32@19.7.1
platform_packages = platformio/framework-arduinoststm32@4.21200.0
board = nucleo_f767zi
framework = arduino
upload_protocol = stlink
monitor_speed = 115200
monitor_echo = yes
monitor_eol = CRLF
