; Mesa Niveladora - Plataforma estabilizada de dois eixos (LAMEC)
; Placa: NUCLEO-F767ZI | Framework: Arduino (STM32duino)
;
; Cada teste é um "environment". Para escolher qual compilar/carregar:
;   - barra inferior do VS Code (env:...) ou
;   - pio run -e servo_test -t upload

[platformio]
default_envs = blink_test

[env]
platform = ststm32
board = nucleo_f767zi
framework = arduino
upload_protocol = stlink
monitor_speed = 115200
monitor_echo = yes
monitor_eol = CRLF
; Flags do Cortex-M7 + printf com floats (ver cpu_flags.py)
extra_scripts = pre:cpu_flags.py

; Teste 0 - diagnóstico: LED a piscar + "vivo N" no monitor
[env:blink_test]
build_src_filter = +<tests/blink_test.cpp>

; Teste 1 - servos MG996R (PWM 50 Hz no TIM4)
[env:servo_test]
build_src_filter = +<tests/servo_test.cpp>

; Teste 2 - ponte Serial(USB) <-> módulo Bluetooth
[env:bt_echo]
build_src_filter = +<tests/bt_echo.cpp>

; Teste 3 - MPU6050 + filtro complementar (I2C1)
[env:imu_test]
build_src_filter = +<tests/imu_test.cpp>

; Teste 4 - integração sem servos: MPU6050 + Bluetooth + USB
[env:sensors_bt_test]
build_src_filter = +<tests/sensors_bt_test.cpp>
